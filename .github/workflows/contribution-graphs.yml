name: Generate 3D & Snake Contribution Graphs

on:
  schedule:
    - cron: "0 0 * * *" # Every day at 00:00 UTC (07:00 WIB)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-graphs.yml"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate Snake contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=a78bfa&color_dots=#f0eef9,#d8ccf8,#a78bfa,#7c3aed,#4c1d95
            dist/github-snake-dark.svg?palette=github-dark&color_snake=a78bfa&color_dots=#161326,#2d244d,#5b4699,#8b6ef3,#c4b5fd

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D SVGs
        run: cp profile-3d-contrib/*.svg dist/

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
