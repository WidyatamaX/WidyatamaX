      <stop offset="100%" stop-color="#0b0a12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ai-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#f5f2eb" opacity="0.065"/>
