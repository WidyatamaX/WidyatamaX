<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="366" viewBox="0 0 1200 366" role="img" aria-label="AI Toolbox featuring Google Gemini and Antigravity">
  <title>AI Toolbox featuring Google Gemini and Antigravity</title>
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a12"/>
      <stop offset="55%" stop-color="#131024"/>
      <stop offset="100%" stop-color="#0d0b17"/>
    </linearGradient>
    <radialGradient id="ai-nebula-l" cx="22%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18"/>
