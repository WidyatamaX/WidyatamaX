<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Reza Widya Utama — @WidyatamaX OMORI Headspace Header">
  <title>Reza Widya Utama — @WidyatamaX OMORI Headspace Header</title>
  <defs>
    <linearGradient id="hdr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a12"/>
      <stop offset="55%" stop-color="#131024"/>
      <stop offset="100%" stop-color="#0d0b17"/>
    </linearGradient>
    <radialGradient id="hdr-nebula-l" cx="22%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b0a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hdr-nebula-r" cx="84%" cy="76%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0b0a12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hdr-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#f5f2eb" opacity="0.065"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    .sway { animation: sway 5.4s ease-in-out infinite; }
    .tw1 { animation: tw 3.2s ease-in-out infinite; }
    .tw2 { animation: tw 4.4s ease-in-out infinite 1.1s; }
    .tw3 { animation: tw 3.8s ease-in-out infinite 0.5s; }
    .blink { animation: blink 1.15s steps(2, start) infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-2.4deg); } 50% { transform: rotate(2.4deg); } }
    @keyframes tw { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.25; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.12; } }
  </style>
  <rect width="1200" height="340" rx="10" fill="url(#hdr-bg)"/>
  <rect width="1200" height="340" rx="10" fill="url(#hdr-nebula-l)"/>
  <rect width="1200" height="340" rx="10" fill="url(#hdr-nebula-r)"/>
  <rect width="1200" height="340" rx="10" fill="url(#hdr-dots)"/>
  <rect x="8" y="8" width="1184" height="324" rx="6" fill="none" stroke="#4c4669" stroke-width="1" stroke-dasharray="4 6" opacity="0.65"/>

    <g opacity="0.38" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3 4" fill="none">
    <path d="M 980 56 L 1060 128 L 1126 78 M 1060 128 L 1095 255 L 1018 286"/>
  </g>
  <!-- Dream crescent moon -->
  <g transform="translate(1078, 178)" opacity="0.72">
    <path d="M 10 -24 A 24 24 0 1 0 24 14 A 19 19 0 1 1 10 -24 Z" fill="none" stroke="#f5f2eb" stroke-width="1.8"/>
  </g>
  <polygon points="82.0,54.5 84.1,59.9 89.5,62.0 84.1,64.1 82.0,69.5 79.9,64.1 74.5,62.0 79.9,59.9" fill="#f5f2eb" opacity="0.92" class="tw1"/>
  <polygon points="145.0,269.5 146.5,273.5 150.5,275.0 146.5,276.5 145.0,280.5 143.5,276.5 139.5,275.0 143.5,273.5" fill="#a78bfa" opacity="0.92" class="tw2"/>
  <polygon points="292.0,69.0 293.4,72.6 297.0,74.0 293.4,75.4 292.0,79.0 290.6,75.4 287.0,74.0 290.6,72.6" fill="#7dd3fc" opacity="0.92" class="tw3"/>
  <polygon points="980.0,49.5 981.8,54.2 986.5,56.0 981.8,57.8 980.0,62.5 978.2,57.8 973.5,56.0 978.2,54.2" fill="#f5f2eb" opacity="0.92" class="tw2"/>
  <polygon points="1060.0,119.5 1062.4,125.6 1068.5,128.0 1062.4,130.4 1060.0,136.5 1057.6,130.4 1051.5,128.0 1057.6,125.6" fill="#a78bfa" opacity="0.92" class="tw1"/>
  <polygon points="1126.0,72.5 1127.5,76.5 1131.5,78.0 1127.5,79.5 1126.0,83.5 1124.5,79.5 1120.5,78.0 1124.5,76.5" fill="#f472b6" opacity="0.92" class="tw3"/>
  <polygon points="1095.0,248.5 1096.8,253.2 1101.5,255.0 1096.8,256.8 1095.0,261.5 1093.2,256.8 1088.5,255.0 1093.2,253.2" fill="#7dd3fc" opacity="0.92" class="tw2"/>
  <polygon points="1018.0,281.2 1019.3,284.7 1022.8,286.0 1019.3,287.3 1018.0,290.8 1016.7,287.3 1013.2,286.0 1016.7,284.7" fill="#fcd34d" opacity="0.92" class="tw1"/>
  <polygon points="56.0,193.5 57.3,196.7 60.5,198.0 57.3,199.3 56.0,202.5 54.7,199.3 51.5,198.0 54.7,196.7" fill="#f472b6" opacity="0.92" class="tw3"/>

  <!-- Hanging Black Lightbulb -->
    <g class="sway" style="transform-origin: 165px 0px;">
    <line x1="165" y1="0" x2="165" y2="96" stroke="#f5f2eb" stroke-width="1.84" opacity="0.72"/>
    <g transform="translate(165, 96) scale(1.15)">
      <!-- Subtle eerie white-lavender aura -->
      <circle cx="0" cy="34" r="34" fill="#a78bfa" opacity="0.13"/>
      <circle cx="0" cy="34" r="24" fill="#f5f2eb" opacity="0.09"/>
      <!-- Screw socket -->
      <rect x="-7" y="0" width="14" height="10" rx="2" fill="#110f1d" stroke="#f5f2eb" stroke-width="1.8"/>
      <line x1="-6" y1="4" x2="6" y2="4" stroke="#f5f2eb" stroke-width="1" opacity="0.7"/>
      <line x1="-6" y1="7.5" x2="6" y2="7.5" stroke="#f5f2eb" stroke-width="1" opacity="0.7"/>
      <!-- Black glass bulb -->
      <path d="M -8 10 C -19 15 -22 28 -18 40 C -14 50 -7 54 0 54 C 7 54 14 50 18 40 C 22 28 19 15 8 10 Z"
            fill="#06050a" stroke="#f5f2eb" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- Inner white sketchy filament -->
      <path d="M -4 14 L -3 28 L 0 24 L 3 28 L 4 14" fill="none" stroke="#f5f2eb" stroke-width="1.2" opacity="0.82" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Tiny highlight ink stroke -->
      <path d="M -12 24 C -13 30 -11 36 -8 40" fill="none" stroke="#f5f2eb" stroke-width="1.3" opacity="0.45" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Tiny sketchy floor shadow under lightbulb -->
  <ellipse cx="165" cy="272" rx="46" ry="7" fill="#a78bfa" opacity="0.12"/>
  <text x="165" y="294" text-anchor="middle" fill="#9b97b8" font-size="11" letter-spacing="2.2">WHITE SPACE</text>

  <!-- Main OMORI RPG Dialogue Box -->
    <g class="rpg-box">
    <rect x="280" y="92" width="680" height="188" rx="2.0" fill="#0b0a12" fill-opacity="0.94" stroke="#f5f2eb" stroke-width="2.8"/>
    <rect x="286" y="98" width="668" height="176" rx="1.0" fill="none" stroke="#f5f2eb" stroke-width="1" opacity="0.65"/>
  </g>

  <!-- Floating Speaker Name Tag -->
    <g class="rpg-box">
    <rect x="304" y="62" width="204" height="40" rx="2.0" fill="#0b0a12" fill-opacity="0.94" stroke="#f5f2eb" stroke-width="2.4"/>
    <rect x="308" y="66" width="196" height="32" rx="1.0" fill="none" stroke="#f5f2eb" stroke-width="1" opacity="0.65"/>
  </g>
  <text x="406" y="87" text-anchor="middle" fill="#f5f2eb" font-size="15" font-weight="700" letter-spacing="2.6">WIDYATAMAX</text>

  <!-- Dialogue Content -->
  <text x="316" y="148" fill="#f5f2eb" font-size="38" font-weight="800" letter-spacing="2.2" class="sans">REZA WIDYA UTAMA</text>
  <text x="318" y="182" fill="#a78bfa" font-size="16" font-weight="600" letter-spacing="0.6">Offline-First Software Builder  ·  Web · Desktop · Android</text>
  <line x1="316" y1="201" x2="924" y2="201" stroke="#4c4669" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="318" y="232" fill="#f5f2eb" font-size="14.5" opacity="0.9">▸ Welcome to my headspace. Building calm, local-first tools</text>
  <text x="336" y="254" fill="#7dd3fc" font-size="13.5" opacity="0.92">OpenFormu (HiGHS WASM)  ·  Defisit Harian  ·  Gemini &amp; Antigravity</text>

  <!-- Blinking RPG Continue Triangle -->
  <polygon points="928,248 942,248 935,260" fill="#f5f2eb" class="blink"/>
</svg>
