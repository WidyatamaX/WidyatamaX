<svg xmlns="http://www.w3.org/2000/svg" width="480" height="216" viewBox="0 0 480 216" role="img" aria-label="Save Point Footer — WidyatamaX">
  <title>Save Point Footer — WidyatamaX</title>
  <defs>
    <linearGradient id="ftm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a12"/>
      <stop offset="55%" stop-color="#131024"/>
      <stop offset="100%" stop-color="#0d0b17"/>
    </linearGradient>
    <radialGradient id="ftm-nebula-l" cx="22%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b0a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ftm-nebula-r" cx="84%" cy="76%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0b0a12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ftm-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#f5f2eb" opacity="0.065"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    .blink { animation: blink 1.15s steps(2, start) infinite; }
    .tw1 { animation: tw 3.4s ease-in-out infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.12; } }
    @keyframes tw { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.25; } }
  </style>
  <rect width="480" height="216" rx="10" fill="url(#ftm-bg)"/>
  <rect width="480" height="216" rx="10" fill="url(#ftm-nebula-l)"/>
  <rect width="480" height="216" rx="10" fill="url(#ftm-dots)"/>
  <polygon points="42.0,21.5 43.3,24.7 46.5,26.0 43.3,27.3 42.0,30.5 40.7,27.3 37.5,26.0 40.7,24.7" fill="#f5f2eb" opacity="0.9" class="tw1"/>
  <polygon points="438.0,23.0 439.4,26.6 443.0,28.0 439.4,29.4 438.0,33.0 436.6,29.4 433.0,28.0 436.6,26.6" fill="#a78bfa" opacity="0.9" class="tw1"/>

    <g class="rpg-box">
    <rect x="22" y="46" width="436" height="148" rx="2.0" fill="#0b0a12" fill-opacity="0.94" stroke="#f5f2eb" stroke-width="2.2"/>
    <rect x="26.5" y="50.5" width="427.0" height="139.0" rx="1.0" fill="none" stroke="#f5f2eb" stroke-width="1" opacity="0.65"/>
  </g>
    <g class="rpg-box">
    <rect x="40" y="22" width="152" height="32" rx="2.0" fill="#0b0a12" fill-opacity="0.94" stroke="#f5f2eb" stroke-width="2.0"/>
    <rect x="43.5" y="25.5" width="145.0" height="25.0" rx="1.0" fill="none" stroke="#f5f2eb" stroke-width="1" opacity="0.65"/>
  </g>
  <text x="116" y="42.5" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="800" letter-spacing="1.8">SAVE POINT</text>

  <text x="240" y="94" text-anchor="middle" fill="#f5f2eb" font-size="14.5" font-weight="700" class="sans">"Thanks for visiting. You've been</text>
  <text x="240" y="116" text-anchor="middle" fill="#f5f2eb" font-size="14.5" font-weight="700" class="sans">coding here as long as you remember."</text>
  <text x="240" y="152" text-anchor="middle" fill="#9b97b8" font-size="11.5">Made with ☕ &amp; offline-first craft</text>
  <text x="240" y="170" text-anchor="middle" fill="#a78bfa" font-size="11.5">@WidyatamaX · Indonesia</text>
  <polygon points="426,170 438,170 432,180" fill="#f5f2eb" class="blink"/>
</svg>
