  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    .spin-slow { animation: spin 36s linear infinite; }
    .spin-rev { animation: spinr 24s linear infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinr { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  </style>
  <rect width="480" height="678" rx="10" fill="url(#aim-bg)"/>
  <rect width="480" height="678" rx="10" fill="url(#aim-dots)"/>

