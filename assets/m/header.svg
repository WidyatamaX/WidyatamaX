<svg xmlns="http://www.w3.org/2000/svg" width="480" height="540" viewBox="0 0 480 540" role="img" aria-label="Reza Widya Utama — Mobile OMORI Header">
  <title>Reza Widya Utama — Mobile OMORI Header</title>
  <defs>
    <linearGradient id="hdrm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a12"/>
      <stop offset="55%" stop-color="#131024"/>
      <stop offset="100%" stop-color="#0d0b17"/>
    </linearGradient>
    <radialGradient id="hdrm-nebula-l" cx="22%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b0a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hdrm-nebula-r" cx="84%" cy="76%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0b0a12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hdrm-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#f5f2eb" opacity="0.065"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    .sway { animation: sway 5.4s ease-in-out infinite; }
    .tw1 { animation: tw 3.2s ease-in-out infinite; }
    .tw2 { animation: tw 4.4s ease-in-out infinite 1.1s; }
    .blink { animation: blink 1.15s steps(2, start) infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
    @keyframes tw { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.25; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.12; } }
  </style>
  <rect width="480" height="540" rx="10" fill="url(#hdrm-bg)"/>
  <rect width="480" height="540" rx="10" fill="url(#hdrm-nebula-l)"/>
  <rect width="480" height="540" rx="10" fill="url(#hdrm-nebula-r)"/>
  <rect width="480" height="540" rx="10" fill="url(#hdrm-dots)"/>
  <rect x="8" y="8" width="464" height="524" rx="6" fill="none" stroke="#4c4669" stroke-width="1" stroke-dasharray="4 6" opacity="0.65"/>

  <polygon points="56.0,55.5 57.8,60.2 62.5,62.0 57.8,63.8 56.0,68.5 54.2,63.8 49.5,62.0 54.2,60.2" fill="#f5f2eb" opacity="0.92" class="tw1"/>
  <polygon points="418.0,68.5 420.1,73.9 425.5,76.0 420.1,78.1 418.0,83.5 415.9,78.1 410.5,76.0 415.9,73.9" fill="#a78bfa" opacity="0.92" class="tw2"/>
  <polygon points="92.0,163.0 93.4,166.6 97.0,168.0 93.4,169.4 92.0,173.0 90.6,169.4 87.0,168.0 90.6,166.6" fill="#7dd3fc" opacity="0.92" class="tw2"/>
  <polygon points="392.0,176.5 393.5,180.5 397.5,182.0 393.5,183.5 392.0,187.5 390.5,183.5 386.5,182.0 390.5,180.5" fill="#f472b6" opacity="0.92" class="tw1"/>
  <polygon points="68.0,509.0 69.4,512.6 73.0,514.0 69.4,515.4 68.0,519.0 66.6,515.4 63.0,514.0 66.6,512.6" fill="#fcd34d" opacity="0.92" class="tw1"/>
  <polygon points="414.0,514.0 415.7,518.3 420.0,520.0 415.7,521.7 414.0,526.0 412.3,521.7 408.0,520.0 412.3,518.3" fill="#7dd3fc" opacity="0.92" class="tw2"/>
    <g class="sway" style="transform-origin: 240px 0px;">
    <line x1="240" y1="0" x2="240" y2="82" stroke="#f5f2eb" stroke-width="1.84" opacity="0.72"/>
    <g transform="translate(240, 82) scale(1.15)">
      <!-- Subtle eerie white-lavender aura -->
      <circle cx="0" cy="34" r="34" fill="#a78bfa" opacity="0.13"/>
      <circle cx="0" cy="34" r="24" fill="#f5f2eb" opacity="0.09"/>
      <!-- Screw socket -->
      <rect x="-7" y="0" width="14" height="10" rx="2" fill="#110f1d" stroke="#f5f2eb" stroke-width="1.8"/>
      <line x1="-6" y1="4" x2="6" y2="4" stroke="#f5f2eb" stroke-width="1" opacity="0.7"/>
      <line x1="-6" y1="7.5" x2="6" y2="7.5" stroke="#f5f2eb" stroke-width="1" opacity="0.7"/>
      <!-- Black glass bulb -->
      <path d="M -8 10 C -19 15 -22 28 -18 40 C -14 50 -7 54 0 54 C 7 54 14 50 18 40 C 22 28 19 15 8 10 Z"
            fill="#06050a" stroke="#f5f2eb" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- Inner white sketchy filament -->
      <path d="M -4 14 L -3 28 L 0 24 L 3 28 L 4 14" fill="none" stroke="#f5f2eb" stroke-width="1.2" opacity="0.82" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Tiny highlight ink stroke -->
      <path d="M -12 24 C -13 30 -11 36 -8 40" fill="none" stroke="#f5f2eb" stroke-width="1.3" opacity="0.45" stroke-linecap="round"/>
    </g>
  </g>
  <ellipse cx="240" cy="186" rx="44" ry="6" fill="#a78bfa" opacity="0.14"/>

  <!-- Main Mobile RPG Box -->
    <g class="rpg-box">
    <rect x="24" y="240" width="432" height="250" rx="2.0" fill="#0b0a12" fill-opacity="0.94" stroke="#f5f2eb" stroke-width="2.6"/>
    <rect x="29.5" y="245.5" width="421.0" height="239.0" rx="1.0" fill="none" stroke="#f5f2eb" stroke-width="1" opacity="0.65"/>
  </g>
    <g class="rpg-box">
    <rect x="42" y="212" width="194" height="38" rx="2.0" fill="#0b0a12" fill-opacity="0.94" stroke="#f5f2eb" stroke-width="2.2"/>
    <rect x="46" y="216" width="186" height="30" rx="1.0" fill="none" stroke="#f5f2eb" stroke-width="1" opacity="0.65"/>
  </g>
  <text x="139" y="236" text-anchor="middle" fill="#f5f2eb" font-size="14" font-weight="700" letter-spacing="2.2">WIDYATAMAX</text>

  <text x="48" y="294" fill="#f5f2eb" font-size="30" font-weight="800" letter-spacing="1.2" class="sans">REZA WIDYA</text>
  <text x="48" y="330" fill="#f5f2eb" font-size="30" font-weight="800" letter-spacing="1.2" class="sans">UTAMA</text>
  <text x="48" y="362" fill="#a78bfa" font-size="13.5" font-weight="600">Offline-First Software Builder</text>
  <text x="48" y="382" fill="#7dd3fc" font-size="13" font-weight="600">Web (PWA) · Desktop · Android</text>
  <line x1="48" y1="400" x2="432" y2="400" stroke="#4c4669" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="48" y="428" fill="#f5f2eb" font-size="13" opacity="0.92">▸ Welcome to my headspace.</text>
  <text x="64" y="450" fill="#9b97b8" font-size="12.5">OpenFormu · Defisit Harian</text>
  <text x="64" y="470" fill="#9b97b8" font-size="12.5">Gemini &amp; Antigravity workflow</text>

  <polygon points="424,462 438,462 431,474" fill="#f5f2eb" class="blink"/>
</svg>
