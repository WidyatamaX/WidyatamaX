<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-label="Save Point Footer — WidyatamaX">
  <title>Save Point Footer — WidyatamaX</title>
  <defs>
    <linearGradient id="ft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a12"/>
      <stop offset="55%" stop-color="#131024"/>
      <stop offset="100%" stop-color="#0d0b17"/>
    </linearGradient>
    <radialGradient id="ft-nebula-l" cx="22%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b0a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ft-nebula-r" cx="84%" cy="76%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0b0a12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ft-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#f5f2eb" opacity="0.065"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    .blink { animation: blink 1.15s steps(2, start) infinite; }
    .tw1 { animation: tw 3.4s ease-in-out infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.12; } }
    @keyframes tw { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.25; } }
  </style>
  <rect width="1200" height="176" rx="10" fill="url(#ft-bg)"/>
