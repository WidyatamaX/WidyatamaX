<svg xmlns="http://www.w3.org/2000/svg" width="420" height="290" viewBox="0 0 420 290" role="img" aria-label="White Space coding desk with sleeping black cat, laptop, sketchbook and coffee">
  <title>White Space coding desk with sleeping black cat, laptop, sketchbook and coffee</title>
  <defs>
    <linearGradient id="desk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a12"/>
      <stop offset="55%" stop-color="#131024"/>
      <stop offset="100%" stop-color="#0d0b17"/>
    </linearGradient>
    <radialGradient id="desk-nebula-l" cx="22%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b0a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="desk-nebula-r" cx="84%" cy="76%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0b0a12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="desk-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#f5f2eb" opacity="0.065"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    .sway { animation: sway 5.2s ease-in-out infinite; }
    .steam1 { animation: steam 2.8s ease-in-out infinite; }
    .steam2 { animation: steam 2.8s ease-in-out infinite 1.1s; }
    .zzz1 { animation: zzz 3.2s ease-in-out infinite; }
    .zzz2 { animation: zzz 3.2s ease-in-out infinite 0.9s; }
    .zzz3 { animation: zzz 3.2s ease-in-out infinite 1.8s; }
    .cur { animation: cur 1.1s steps(2, start) infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 50% { opacity: 0.7; } 100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes zzz { 0% { opacity: 0; transform: translate(0px, 4px); } 45% { opacity: 0.9; } 100% { opacity: 0; transform: translate(6px, -10px); } }
    @keyframes cur { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
  <rect width="420" height="290" rx="8" fill="url(#desk-bg)"/>
  <rect width="420" height="290" rx="8" fill="url(#desk-nebula-l)"/>
  <rect width="420" height="290" rx="8" fill="url(#desk-dots)"/>
    <g class="rpg-box">
    <rect x="6" y="6" width="408" height="278" rx="2.0" fill="#0b0a12" fill-opacity="0.65" stroke="#f5f2eb" stroke-width="2.4"/>
    <rect x="11" y="11" width="398" height="268" rx="1.0" fill="none" stroke="#f5f2eb" stroke-width="1" opacity="0.65"/>
  </g>

  <!-- Top scene bar -->
  <line x1="14" y1="36" x2="406" y2="36" stroke="#f5f2eb" stroke-width="1" opacity="0.45"/>
  <text x="26" y="26" fill="#9b97b8" font-size="10.5" letter-spacing="1.6">▸ WHITE_SPACE // DESK.SCENE</text>
  <text x="394" y="26" text-anchor="end" fill="#a78bfa" font-size="10.5">✦ FOCUSED</text>

  <!-- Headspace Window on Wall -->
  <rect x="268" y="54" width="110" height="82" rx="2" fill="#0d0a1a" stroke="#f5f2eb" stroke-width="1.6"/>
  <line x1="323" y1="54" x2="323" y2="136" stroke="#f5f2eb" stroke-width="1" opacity="0.5"/>
  <line x1="268" y1="95" x2="378" y2="95" stroke="#f5f2eb" stroke-width="1" opacity="0.5"/>
  <polygon points="290.0,69.8 291.2,72.8 294.2,74.0 291.2,75.2 290.0,78.2 288.8,75.2 285.8,74.0 288.8,72.8" fill="#f5f2eb" opacity="0.9"/>
  <polygon points="352.0,68.5 353.0,71.0 355.5,72.0 353.0,73.0 352.0,75.5 351.0,73.0 348.5,72.0 351.0,71.0" fill="#a78bfa" opacity="0.85"/>
  <polygon points="300.0,115.0 300.8,117.2 303.0,118.0 300.8,118.8 300.0,121.0 299.2,118.8 297.0,118.0 299.2,117.2" fill="#7dd3fc" opacity="0.8"/>
  <path d="M 350 105 A 11 11 0 1 0 358 122 A 8.5 8.5 0 1 1 350 105 Z" fill="#fcd34d" opacity="0.85"/>

  <!-- Mini Hanging Black Lightbulb -->
    <g class="sway" style="transform-origin: 206px 36px;">
    <line x1="206" y1="36" x2="206" y2="70" stroke="#f5f2eb" stroke-width="0.90" opacity="0.72"/>
    <g transform="translate(206, 70) scale(0.56)">
      <!-- Subtle eerie white-lavender aura -->
      <circle cx="0" cy="34" r="34" fill="#a78bfa" opacity="0.13"/>
      <circle cx="0" cy="34" r="24" fill="#f5f2eb" opacity="0.09"/>
      <!-- Screw socket -->
      <rect x="-7" y="0" width="14" height="10" rx="2" fill="#110f1d" stroke="#f5f2eb" stroke-width="1.8"/>
      <line x1="-6" y1="4" x2="6" y2="4" stroke="#f5f2eb" stroke-width="1" opacity="0.7"/>
      <line x1="-6" y1="7.5" x2="6" y2="7.5" stroke="#f5f2eb" stroke-width="1" opacity="0.7"/>
      <!-- Black glass bulb -->
      <path d="M -8 10 C -19 15 -22 28 -18 40 C -14 50 -7 54 0 54 C 7 54 14 50 18 40 C 22 28 19 15 8 10 Z"
            fill="#06050a" stroke="#f5f2eb" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- Inner white sketchy filament -->
      <path d="M -4 14 L -3 28 L 0 24 L 3 28 L 4 14" fill="none" stroke="#f5f2eb" stroke-width="1.2" opacity="0.82" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Tiny highlight ink stroke -->
      <path d="M -12 24 C -13 30 -11 36 -8 40" fill="none" stroke="#f5f2eb" stroke-width="1.3" opacity="0.45" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Desk Surface -->
  <rect x="24" y="206" width="372" height="14" rx="2" fill="#1b1730" stroke="#f5f2eb" stroke-width="1.8"/>
  <rect x="38" y="220" width="12" height="50" fill="#110f1d" stroke="#f5f2eb" stroke-width="1.4"/>
  <rect x="370" y="220" width="12" height="50" fill="#110f1d" stroke="#f5f2eb" stroke-width="1.4"/>

  <!-- Open Laptop -->
  <g transform="translate(46, 120)">
    <!-- Screen glow -->
    <rect x="2" y="2" width="114" height="74" rx="4" fill="#a78bfa" opacity="0.14"/>
    <rect x="6" y="6" width="106" height="68" rx="3" fill="#110f1d" stroke="#f5f2eb" stroke-width="1.8"/>
    <rect x="12" y="12" width="94" height="56" rx="1" fill="#090714" stroke="#4c4669" stroke-width="1"/>
    <!-- Code lines -->
    <rect x="18" y="19" width="32" height="3.5" rx="1" fill="#a78bfa"/>
    <rect x="54" y="19" width="22" height="3.5" rx="1" fill="#7dd3fc"/>
    <rect x="24" y="28" width="46" height="3.5" rx="1" fill="#f5f2eb" opacity="0.8"/>
    <rect x="24" y="37" width="28" height="3.5" rx="1" fill="#86efac"/>
    <rect x="56" y="37" width="34" height="3.5" rx="1" fill="#f472b6"/>
    <rect x="18" y="46" width="40" height="3.5" rx="1" fill="#7dd3fc"/>
    <rect x="18" y="55" width="18" height="3.5" rx="1" fill="#a78bfa"/>
    <rect x="40" y="54" width="6" height="6" fill="#f5f2eb" class="cur"/>
    <!-- Keyboard base -->
    <path d="M 0 74 L 118 74 L 128 86 L -10 86 Z" fill="#1b1730" stroke="#f5f2eb" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- Red Sketchbook (OMORI nod) -->
  <g transform="translate(184, 188)">
    <rect x="0" y="5" width="48" height="13" rx="1.5" fill="#fb7185" stroke="#f5f2eb" stroke-width="1.5"/>
    <line x1="6" y1="5" x2="6" y2="18" stroke="#f5f2eb" stroke-width="1.2"/>
    <line x1="12" y1="11" x2="38" y2="11" stroke="#f5f2eb" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- Coffee Mug + Steam -->
  <g transform="translate(246, 174)">
    <path d="M 7 -4 C 4 -10 10 -14 7 -20" fill="none" stroke="#f5f2eb" stroke-width="1.3" stroke-linecap="round" class="steam1"/>
    <path d="M 15 -2 C 12 -9 18 -13 15 -19" fill="none" stroke="#7dd3fc" stroke-width="1.3" stroke-linecap="round" class="steam2"/>
    <rect x="0" y="4" width="22" height="28" rx="3" fill="#0b0a12" stroke="#f5f2eb" stroke-width="1.8"/>
    <path d="M 22 10 C 30 10 30 24 22 24" fill="none" stroke="#f5f2eb" stroke-width="1.8"/>
    <rect x="4" y="13" width="14" height="5" fill="#a78bfa" opacity="0.7"/>
  </g>

  <!-- Sleeping Black Cat (Mewo-inspired original vector) -->
  <g transform="translate(292, 166)">
    <!-- Soft cushion -->
    <ellipse cx="42" cy="38" rx="42" ry="6" fill="#a78bfa" opacity="0.22"/>
    <!-- Curled body -->
    <path d="M 12 38 C 8 22 22 12 42 12 C 62 12 74 22 72 38 Z" fill="#06050a" stroke="#f5f2eb" stroke-width="1.9" stroke-linejoin="round"/>
    <!-- Cat head -->
    <circle cx="24" cy="24" r="13" fill="#06050a" stroke="#f5f2eb" stroke-width="1.9"/>
    <!-- Ears -->
    <polygon points="14,15 16,5 22,12" fill="#06050a" stroke="#f5f2eb" stroke-width="1.7" stroke-linejoin="round"/>
    <polygon points="26,12 32,5 34,15" fill="#06050a" stroke="#f5f2eb" stroke-width="1.7" stroke-linejoin="round"/>
    <!-- Sleeping happy eyes -->
    <path d="M 17 24 Q 20 21 22 24" fill="none" stroke="#f5f2eb" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 26 24 Q 29 21 31 24" fill="none" stroke="#f5f2eb" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Tiny mouth -->
    <circle cx="24" cy="28" r="1.2" fill="#f472b6"/>
    <!-- Curled tail -->
    <path d="M 70 34 C 84 32 86 20 76 18" fill="none" stroke="#f5f2eb" stroke-width="2" stroke-linecap="round"/>
    <!-- Floating Zzz -->
    <text x="38" y="4" fill="#f5f2eb" font-size="10" font-weight="700" class="zzz1">z</text>
    <text x="48" y="-5" fill="#a78bfa" font-size="11.5" font-weight="700" class="zzz2">z</text>
    <text x="58" y="-14" fill="#7dd3fc" font-size="13" font-weight="700" class="zzz3">Z</text>
  </g>

  <!-- Subtle floor caption -->
  <text x="210" y="254" text-anchor="middle" fill="#9b97b8" font-size="11">waiting for something to ship...</text>
</svg>
